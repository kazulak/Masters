services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 30

  ollama-pull:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-embeddinggemma}
      OLLAMA_GENERATE_MODEL: ${OLLAMA_GENERATE_MODEL:-gemma4:e2b}
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama-models:/root/.ollama
    entrypoint: ["/bin/sh", "-lc"]
    command: ["ollama pull $$OLLAMA_EMBED_MODEL && ollama pull $$OLLAMA_GENERATE_MODEL"]
    restart: "no"

  llm-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_PATH: services/llm-service
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama-with-fallback}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-embeddinggemma}
      OLLAMA_GENERATE_MODEL: ${OLLAMA_GENERATE_MODEL:-gemma4:e2b}
      OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-192}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-240}
      OLLAMA_THINK: ${OLLAMA_THINK:-false}
    ports:
      - "${LLM_SERVICE_PORT:-8005}:8000"
    depends_on:
      ollama-pull:
        condition: service_completed_successfully

volumes:
  ollama-models:
