name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_azure:
        description: "Run the manual Azure deployment gate"
        required: true
        default: false
        type: boolean
      resource_group:
        description: "Azure resource group"
        required: false
        default: "book-ai-library-rg"
        type: string
      location:
        description: "Azure location"
        required: false
        default: "westeurope"
        type: string
      app_name:
        description: "Application name prefix"
        required: false
        default: "book-ai-library"
        type: string
      image_tag:
        description: "Container image tag"
        required: false
        default: "latest"
        type: string
      deploy_apps:
        description: "Build/push images and deploy Container Apps"
        required: true
        default: false
        type: boolean
      deploy_postgres:
        description: "Deploy Azure Database for PostgreSQL Flexible Server"
        required: true
        default: false
        type: boolean

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall shared services tests
      - run: pytest -q

  postgres-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - uses: docker/setup-buildx-action@v3
      - run: docker compose -f docker-compose.ci.yml up -d postgres
      - run: |
          for i in {1..30}; do
            docker compose -f docker-compose.ci.yml exec -T postgres pg_isready -U book_ai -d book_ai_library && exit 0
            sleep 1
          done
          exit 1
      - run: TEST_DATABASE_URL=postgresql://book_ai:book_ai_password@127.0.0.1:5432/book_ai_library pytest -q tests/test_postgres_storage.py
      - if: always()
        run: docker compose -f docker-compose.ci.yml down -v

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - uses: docker/setup-buildx-action@v3
      - run: docker compose -f docker-compose.ci.yml config
      - run: docker compose -f docker-compose.llm.yml config
      - run: docker compose -f docker-compose.yml -f docker-compose.amd.yml config
      - run: docker compose -f docker-compose.llm.yml -f docker-compose.llm.amd.yml config
      - run: PYTHON_BIN=python scripts/compose_smoke.sh

  bicep-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/cli@v2
        with:
          inlineScript: az bicep build --file infra/bicep/main.bicep

  azure-deploy-gate:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_azure
    needs: [test, postgres-integration, compose-smoke, bicep-build]
    runs-on: ubuntu-latest
    environment: azure-manual
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: |
          scripts/azure_what_if.sh \
            "${{ inputs.resource_group }}" \
            "${{ inputs.location }}" \
            "${{ inputs.app_name }}" \
            "${{ inputs.image_tag }}"
        env:
          DEPLOY_APPS: ${{ inputs.deploy_apps }}
          DEPLOY_POSTGRES: ${{ inputs.deploy_postgres }}
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_EMBED_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_EMBED_DEPLOYMENT }}
          AZURE_OPENAI_CHAT_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_CHAT_DEPLOYMENT }}
      - run: |
          scripts/deploy_azure.sh \
            "${{ inputs.resource_group }}" \
            "${{ inputs.location }}" \
            "${{ inputs.app_name }}" \
            "${{ inputs.image_tag }}"
        env:
          DEPLOY_APPS: ${{ inputs.deploy_apps }}
          DEPLOY_POSTGRES: ${{ inputs.deploy_postgres }}
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_EMBED_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_EMBED_DEPLOYMENT }}
          AZURE_OPENAI_CHAT_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_CHAT_DEPLOYMENT }}
