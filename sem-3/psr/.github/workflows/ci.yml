name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_azure:
        description: "Run the manual Azure deployment gate"
        required: true
        default: false
        type: boolean

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall shared services tests
      - run: pytest -q

  postgres-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - uses: docker/setup-buildx-action@v3
      - run: docker compose -f docker-compose.ci.yml up -d postgres
      - run: |
          for i in {1..30}; do
            docker compose -f docker-compose.ci.yml exec -T postgres pg_isready -U book_ai -d book_ai_library && exit 0
            sleep 1
          done
          exit 1
      - run: TEST_DATABASE_URL=postgresql://book_ai:book_ai_password@127.0.0.1:5432/book_ai_library pytest -q tests/test_postgres_storage.py
      - if: always()
        run: docker compose -f docker-compose.ci.yml down -v

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - uses: docker/setup-buildx-action@v3
      - run: docker compose -f docker-compose.ci.yml config
      - run: PYTHON_BIN=python scripts/compose_smoke.sh

  bicep-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/cli@v2
        with:
          inlineScript: az bicep build --file infra/bicep/main.bicep

  azure-deploy-gate:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_azure
    needs: [test, postgres-integration, compose-smoke, bicep-build]
    runs-on: ubuntu-latest
    environment: azure-manual
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: scripts/deploy_azure.sh
