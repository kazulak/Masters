services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: book_ai_library
      POSTGRES_USER: book_ai
      POSTGRES_PASSWORD: book_ai_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U book_ai -d book_ai_library"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 30

  ollama-pull:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-embeddinggemma}
      OLLAMA_GENERATE_MODEL: ${OLLAMA_GENERATE_MODEL:-gemma4:e2b}
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama-models:/root/.ollama
    entrypoint: ["/bin/sh", "-lc"]
    command: ["ollama pull $$OLLAMA_EMBED_MODEL && ollama pull $$OLLAMA_GENERATE_MODEL"]
    restart: "no"

  llm-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_PATH: services/llm-service
    environment:
      LLM_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-embeddinggemma}
      OLLAMA_GENERATE_MODEL: ${OLLAMA_GENERATE_MODEL:-gemma4:e2b}
    ports:
      - "8005:8000"
    depends_on:
      ollama-pull:
        condition: service_completed_successfully

  book-catalog:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_PATH: services/book-catalog
    environment:
      DATABASE_URL: postgresql://book_ai:book_ai_password@postgres:5432/book_ai_library
      OPEN_LIBRARY_BASE_URL: https://openlibrary.org
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy

  user-profile:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_PATH: services/user-profile
    environment:
      DATABASE_URL: postgresql://book_ai:book_ai_password@postgres:5432/book_ai_library
      BOOK_CATALOG_URL: http://book-catalog:8000
      DEFAULT_USER_ID: demo-user
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      book-catalog:
        condition: service_started

  embedding-worker:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_PATH: services/embedding-worker
    environment:
      DATABASE_URL: postgresql://book_ai:book_ai_password@postgres:5432/book_ai_library
      LLM_SERVICE_URL: http://llm-service:8000
    ports:
      - "8003:8000"
    depends_on:
      postgres:
        condition: service_healthy
      llm-service:
        condition: service_started

  recommendation:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_PATH: services/recommendation
    environment:
      DATABASE_URL: postgresql://book_ai:book_ai_password@postgres:5432/book_ai_library
      DEFAULT_USER_ID: demo-user
    ports:
      - "8004:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/streamlit/Dockerfile
    environment:
      USER_PROFILE_URL: http://user-profile:8000
      BOOK_CATALOG_URL: http://book-catalog:8000
      RECOMMENDATION_URL: http://recommendation:8000
      DEFAULT_USER_ID: demo-user
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    ports:
      - "8501:8501"
    depends_on:
      user-profile:
        condition: service_started
      book-catalog:
        condition: service_started
      recommendation:
        condition: service_started

volumes:
  postgres-data:
  ollama-models:
