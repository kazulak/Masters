services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: book_ai_library
      POSTGRES_USER: book_ai
      POSTGRES_PASSWORD: book_ai_password
    ports:
      - "${CI_POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U book_ai -d book_ai_library"]
      interval: 5s
      timeout: 5s
      retries: 20

  llm-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_PATH: services/llm-service
    environment:
      LLM_PROVIDER: deterministic
    ports:
      - "${CI_LLM_SERVICE_PORT:-18005}:8000"

  book-catalog:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_PATH: services/book-catalog
    environment:
      DATABASE_URL: postgresql://book_ai:book_ai_password@postgres:5432/book_ai_library
    ports:
      - "${CI_BOOK_CATALOG_PORT:-18002}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  user-profile:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_PATH: services/user-profile
    environment:
      DATABASE_URL: postgresql://book_ai:book_ai_password@postgres:5432/book_ai_library
      BOOK_CATALOG_URL: http://book-catalog:8000
      DEFAULT_USER_ID: demo-user
    ports:
      - "${CI_USER_PROFILE_PORT:-18001}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      book-catalog:
        condition: service_started

  embedding-worker:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_PATH: services/embedding-worker
    environment:
      DATABASE_URL: postgresql://book_ai:book_ai_password@postgres:5432/book_ai_library
      LLM_SERVICE_URL: http://llm-service:8000
    ports:
      - "${CI_EMBEDDING_WORKER_PORT:-18003}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      llm-service:
        condition: service_started

  recommendation:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_PATH: services/recommendation
    environment:
      DATABASE_URL: postgresql://book_ai:book_ai_password@postgres:5432/book_ai_library
      DEFAULT_USER_ID: demo-user
      LLM_SERVICE_URL: http://llm-service:8000
    ports:
      - "${CI_RECOMMENDATION_PORT:-18004}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      llm-service:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: frontend/streamlit/Dockerfile
    environment:
      USER_PROFILE_URL: http://user-profile:8000
      BOOK_CATALOG_URL: http://book-catalog:8000
      EMBEDDING_WORKER_URL: http://embedding-worker:8000
      RECOMMENDATION_URL: http://recommendation:8000
      LLM_SERVICE_URL: http://llm-service:8000
      DEFAULT_USER_ID: demo-user
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    ports:
      - "${CI_FRONTEND_PORT:-18501}:8501"
    depends_on:
      user-profile:
        condition: service_started
      book-catalog:
        condition: service_started
      embedding-worker:
        condition: service_started
      recommendation:
        condition: service_started
      llm-service:
        condition: service_started
