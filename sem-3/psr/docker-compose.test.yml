services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: book_ai_library
      POSTGRES_USER: book_ai
      POSTGRES_PASSWORD: book_ai_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U book_ai -d book_ai_library"]
      interval: 5s
      timeout: 5s
      retries: 20

  pytest:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      APP_STATE_FILE: /tmp/book-ai-test-state.json
      TEST_DATABASE_URL: postgresql://book_ai:book_ai_password@postgres:5432/book_ai_library
    depends_on:
      postgres:
        condition: service_healthy
