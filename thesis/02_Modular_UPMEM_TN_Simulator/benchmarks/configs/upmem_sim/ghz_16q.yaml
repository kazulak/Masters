schema_version: benchmark_config-0.1

experiment:
  id: ghz_16q_upmem_sim
  description: Raw UPMEM DenseGEMM MVP route under UPMEM simulator for GHZ 16q.
  seed: 0
  tags: [upmem, simulator, mvp, sanity]
  output_dir: runs/ghz_16q_upmem_sim

workload:
  kind: builtin_circuit
  name: ghz_chain
  n_qubits: 16

planner:
  engine: opt_einsum
  optimize: greedy

execution:
  warmups: 1
  repeats: 3
  routes:
    enabled: [raw_upmem_dense]
    forced: raw_upmem_dense
    disabled: [cpu_reference, quest_exact_statevector, gpu_cupy, simplepim_default, custom_dense, sparsep, pidcomm_collective]
  data_format:
    name: complex_f64_host
    logical_dtype: complex_f64
    accumulator: complex_f64
    scale_scope: none

measurement:
  energy:
    mode: estimated_static_power
    cpu_watts: 65.0

validation:
  reference: numpy_full_einsum
  tolerances:
    max_abs_error: 1.0e-12
    max_rel_error: 1.0e-12
    norm_drift: 1.0e-12
    min_fidelity: 0.999

