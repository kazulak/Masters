[build-system]
requires = ["setuptools>=59"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-bench"
version = "0.1.0"
description = "Route-aware quantum simulation benchmark framework for thesis evaluation"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "opt_einsum",
  "cotengra",
  "quimb",
  "PyYAML",
  "matplotlib",
]

[project.optional-dependencies]
test = ["pytest", "ruff==0.15.21"]
dev = ["pytest", "ruff==0.15.21"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
