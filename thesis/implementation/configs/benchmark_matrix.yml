schema_version: 1
matrix_id: thesis_benchmark_matrix

planner:
  engine: opt_einsum
  optimize: greedy

route_categories:
  - route_category: cpu_tn_exact
    route_id: cpu_tn_einsum_exact
    route_status: implemented
    execution_scope: full_circuit
    target: cpu
    validation_scope: full_circuit_amplitudes
    evidence_type: measured
    output_authority: authoritative
    validation_policy: full_exact

  - route_category: gpu_tn_exact
    route_id: planned
    route_status: planned
    execution_scope: full_circuit
    target: gpu
    validation_scope: full_circuit_amplitudes
    evidence_type: planned
    output_authority: authoritative
    validation_policy: full_exact

  - route_category: cpu_full_state
    route_id: quest_cpu_full_state_benchmark
    route_status: implemented
    execution_scope: full_circuit
    target: cpu
    validation_scope: not_applicable
    evidence_type: measured
    output_authority: benchmark_only
    validation_policy: metrics_only

  - route_category: gpu_full_state
    route_id: planned
    route_status: planned
    execution_scope: full_circuit
    target: gpu
    validation_scope: full_state
    evidence_type: planned
    output_authority: authoritative
    validation_policy: full_exact

  - route_category: upmem_tn_runtime
    route_id: not_applicable
    route_status: model_only
    execution_scope: model_only
    target: upmem_simulator
    validation_scope: task_output
    evidence_type: modeled
    output_authority: model_only
    validation_policy: not_applicable

planned_backend_families:
  - simplepim_dense_backend
  - sparsep_sparse_backend

upmem_runtime:
  implemented_execution_classes:
    - L1_WRAM
    - L2_SINGLE_DPU_MRAM
  modeled_execution_classes:
    - L2_SINGLE_DPU_MRAM
    - L3_MULTI_DPU
    - L4_OUT_OF_SCOPE
  planned_execution_classes:
    - L2_SINGLE_DPU_MRAM
    - L3_MULTI_DPU
  implementation_notes:
    L1_WRAM: implemented for task-level simulator dense bridge subset only
    L2_SINGLE_DPU_MRAM: implemented for task-level simulator real-valued dense bridge subset only; modeled outside that subset
    L3_MULTI_DPU: model-only multi-DPU distribution pressure class
    L4_OUT_OF_SCOPE: model-only aggregate memory boundary

resource_models:
  - id: default
    available_dpus: 64
    per_dpu_wram_bytes: 65536
    effective_wram_bytes: 61440
    per_dpu_mram_bytes: 67108864
    max_task_group_dpus: 64

  - id: small
    available_dpus: 4
    per_dpu_wram_bytes: 65536
    effective_wram_bytes: 49152
    per_dpu_mram_bytes: 8388608
    max_task_group_dpus: 4

  - id: large
    available_dpus: 256
    per_dpu_wram_bytes: 65536
    effective_wram_bytes: 61440
    per_dpu_mram_bytes: 67108864
    max_task_group_dpus: 128

  - id: future_hardware_placeholder
    available_dpus: 512
    per_dpu_wram_bytes: 65536
    effective_wram_bytes: 61440
    per_dpu_mram_bytes: 67108864
    max_task_group_dpus: 256

workloads:
  - id: ghz_4q
    workload_family: GHZ
    metadata:
      workload_type: real_circuit
    circuit:
      kind: builtin
      name: ghz_chain
      n_qubits: 4

  - id: qrng_4q
    workload_family: QRNG
    metadata:
      workload_type: real_circuit
    circuit:
      kind: builtin
      name: QRNG
      n_qubits: 4

  - id: bv_5q
    workload_family: BV
    metadata:
      workload_type: real_circuit
    circuit:
      kind: builtin
      name: BV
      n_qubits: 5

  - id: bb84_6q
    workload_family: BB84
    metadata:
      workload_type: real_circuit
    circuit:
      kind: builtin
      name: BB84
      n_qubits: 6

  - id: hs_6q
    workload_family: HS
    metadata:
      workload_type: real_circuit
    circuit:
      kind: builtin
      name: HS
      n_qubits: 6
      logical_qubits: 3
      depth: 2

  - id: synthetic_l1_independent
    workload_family: synthetic_l1
    metadata:
      workload_type: synthetic_pressure
      execution_scope: model_only
      not_real_quantum_circuit: true
      pressure_scale: 1
    circuit:
      kind: synthetic_pressure
      name: synthetic_l1_independent
      profile: independent_gemm
      task_count: 8
      gemm_m: 16
      gemm_k: 16
      gemm_n: 16

  - id: synthetic_l2_single_dpu_mram
    workload_family: synthetic_l2
    metadata:
      workload_type: synthetic_pressure
      execution_scope: model_only
      not_real_quantum_circuit: true
      pressure_scale: 2
    circuit:
      kind: synthetic_pressure
      name: synthetic_l2_single_dpu_mram
      profile: single_gemm
      task_count: 1
      gemm_m: 512
      gemm_k: 512
      gemm_n: 512

  - id: synthetic_l3_multi_dpu
    workload_family: synthetic_l3
    metadata:
      workload_type: synthetic_pressure
      execution_scope: model_only
      not_real_quantum_circuit: true
      pressure_scale: 3
    circuit:
      kind: synthetic_pressure
      name: synthetic_l3_multi_dpu
      profile: single_gemm
      task_count: 1
      gemm_m: 8192
      gemm_k: 8192
      gemm_n: 16

  - id: synthetic_l4_out_of_scope
    workload_family: synthetic_l4
    metadata:
      workload_type: synthetic_pressure
      execution_scope: model_only
      not_real_quantum_circuit: true
      pressure_scale: 4
    circuit:
      kind: synthetic_pressure
      name: synthetic_l4_out_of_scope
      profile: single_gemm
      task_count: 1
      gemm_m: 65536
      gemm_k: 65536
      gemm_n: 2
