schema_version: 1
milestones:
  - id: M4.5
    title: Descriptor-driven raw-SDK TaskGraph route
    status: tracked_verified
    summary: >-
      Tracked ETH physical functionality capsule for a fixed three-task
      TaskGraph on one and two DPUs. The route uses SimplePIM-derived
      initialization and raw UPMEM SDK allocation, transfer, and launch, with
      final-session CPU-reference validation and no simulator or CPU fallback.
      It is not timing, speedup, or scaling evidence.
    source_commit: c7bbf957d17346e819c52fc45ca592c3bcb691ca
    record_commit: 1a98cfb92068b0c87e112a9455c5d317dda4e0d7
    source_commands:
      - make upmem-simplepim-plan
      - make upmem-simplepim-run
    replay_commands:
      - make upmem-simplepim-plan
      - make upmem-simplepim-run
    evidence_origin: tracked
    evidence:
      root: thesis_results/physical_simplepim_taskgraph_m4_5
      checksums: checksums.json
      capsule_manifest: capsule_manifest.json
    allowed_claims:
      - bounded physical one-DPU and two-DPU TaskGraph execution
      - dependency-preserving two-DPU frontier execution with host-mediated handoff
      - final-session CPU-reference validation and aggregate exact-once completion
      - application-visible transfer accounting without simulator or CPU fallback
    prohibited_claims:
      - per-repeat output or completion validation
      - runtime, speedup, scaling, overlap, energy, or tasklet-parallelism
      - multi-rank, multi-DIMM, PID-Comm, ATiM, or SparseP execution
      - general quantum tensor-network performance
    sources:
      - thesis_results/physical_simplepim_taskgraph_m4_5/README.md
      - thesis_results/physical_simplepim_taskgraph_m4_5/run_manifest.json

