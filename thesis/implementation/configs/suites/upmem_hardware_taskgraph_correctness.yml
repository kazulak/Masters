schema_version: 2
suite_id: upmem_hardware_taskgraph_correctness
metadata:
  purpose: physical_single_dpu_circuit_taskgraph_correctness
  hardware_taskgraph_schema_version: upmem_hardware_taskgraph_v1
  hardware_profile:
    hardware_profile_version: hardware_taskgraph_single_dpu_v1
    target: hardware
    backend_id: upmem_sdk_hardware_taskgraph
    route_id: upmem_tn_hardware_taskgraph
    session_protocol: generic_loop_batch_session_v1
    requested_dpu_count: 1
    tasklets_per_dpu: 1
    max_rank: 16
    max_tensor_elements: 256
    max_contracted_combinations: 256
    output_tile_elements: 64
    numeric_modes: [none, per_task_input_quantize]
    complex_policy: split_real_imag_float32
    synchronous_execution: true
    timeout_s: 30.0
    performance_claim_applicable: false
defaults:
  warmups: 1
  repeats: 5
  planner: {engine: opt_einsum, optimize: greedy}
routes:
  - id: upmem_tn_hardware_taskgraph
    role: hardware_taskgraph_correctness
    required: false
workloads:
  - id: bv_3q_hardware_taskgraph_real
    hardware_numeric_coverage: real
    circuit: {kind: builtin, name: BV, n_qubits: 3}
  - id: xor_3q_hardware_taskgraph_real
    hardware_numeric_coverage: real
    circuit: {kind: builtin, name: XOR, n_qubits: 3}
  - id: quantization_stress_2q_hardware_taskgraph_split_complex
    hardware_numeric_coverage: split_complex
    circuit: {kind: builtin, name: quantization_stress, n_qubits: 2, repeat_layers: 1}
