schema_version: 2
suite_id: upmem_hardware_sliced_resident_mvp

metadata:
  purpose: manual_m2_two_dpu_sliced_resident_functionality_timing_mvp
  manual_invocation_required: true
  deterministic_unitary_only: true
  quantization_mode: none
  hardware_sliced_resident_m2_schema_version: upmem_hardware_sliced_resident_m2_v1
  hardware_profile:
    hardware_profile_version: hardware_sliced_resident_two_dpu_m2_v1
    target: hardware
    backend_id: upmem_sdk_hardware_sliced_resident_two_dpu
    route_id: upmem_tn_hardware_sliced_resident_two_dpu
    requested_dpu_count: 2
    slices: 2
    tasklets_per_dpu: 1
    numeric_modes: [none]
    synchronous_execution: true
    timeout_s: 30.0
    performance_claim_applicable: false
  claim_boundary: functionality_and_timing_mvp_only_no_speedup_claim

defaults:
  warmups: 1
  repeats: 3
  timeout_s: 30.0
  planner: {engine: opt_einsum, optimize: greedy}

routes:
  - id: upmem_tn_hardware_sliced_resident_two_dpu
    role: required_manual_hardware_m2_mvp
    required: true
    options:
      backend_id: upmem_sdk_hardware_sliced_resident_two_dpu
      quantization_mode: none
      slices: 2
      requested_dpu_count: 2
      tasklets_per_dpu: 1

workloads:
  - id: one_qubit_x_m2
    hardware_numeric_coverage: real
    circuit: {kind: qasm_file, name: one_qubit_x, path: configs/circuits/upmem_m2/one_qubit_x.qasm}
    expected_output: [0.0, 1.0]
  - id: one_qubit_h_m2
    hardware_numeric_coverage: real
    circuit: {kind: qasm_file, name: one_qubit_h, path: configs/circuits/upmem_m2/one_qubit_h.qasm}
    expected_output: [0.7071067811865475, 0.7071067811865475]
  - id: one_qubit_z_m2
    hardware_numeric_coverage: real
    circuit: {kind: qasm_file, name: one_qubit_z, path: configs/circuits/upmem_m2/one_qubit_z.qasm}
    expected_output: [1.0, 0.0]
