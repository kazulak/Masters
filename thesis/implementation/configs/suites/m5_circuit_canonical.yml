schema_version: m5_circuit_study_v1
study_id: m5_circuit_canonical

metadata:
  purpose: whole_circuit_taskgraph_canonical_benchmark
  claim_boundary: same_plan_measured_physical_route
  claims_allowed:
    - same_plan_cpu_physical_runtime_comparison
    - standard_path_baseline_runtime_comparison
    - numeric_policy_runtime_and_accuracy_comparison
  claims_forbidden:
    - energy
    - cross_algorithm_speedup_without_matched_baselines
    - planner_optimality
    - multi_rank_scaling
  route_description: host_managed_graph_intermediates_with_tiled_physical_v4_tasks
  physical_rank_paths_are_placeholders: true
  report_pairing_required: true
  energy_measurement: unavailable
  path_comparison: two_standard_executable_baselines_not_upmem_aware_planning

