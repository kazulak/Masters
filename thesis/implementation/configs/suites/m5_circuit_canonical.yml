planner_variants:
  - id: opt_einsum_greedy
    label: opt_einsum greedy
    planner: {engine: opt_einsum, optimize: greedy}
  - id: cotengra_flops_seed0
    label: cotengra FLOPs greedy (seed 0)
    planner:
      engine: cotengra
      objective: flops
      methods: greedy
      max_repeats: 1
      seed: 0

numeric_policies:
  - {id: float32_real, label: float32 real, policy: float32_real}
  - {id: host_packed_int8, label: host packed int8, policy: host_packed_int8}

engine_variants:
  - id: numpy_cpu
    engine: numpy_cpu
    label: NumPy CPU reference
    topology: {backend: cpu}
    timeout_enforcement: posthoc_observation
  - id: upmem_physical_1rank_8dpu
    engine: m5_whole_circuit_v4
    label: UPMEM physical, 1 rank, 8 DPU
    topology:
      backend: upmem
      rank_paths: [/dev/dpu_rank0]
      dpus: 8
      tasklets_per_device: 1
    timeout_enforcement: engine_subprocess
    executor_config:
      profile: m5_whole_circuit_v4_v1
      abi: execution_plan_v4
      session_protocol: persistent_rank_session_v1
      dispatch_mode: bulk_set_synchronous_v1
      kernel_identity: dpu_gemm_tile_v4
      execution_class: physical_v4_output_tile

warmups: 1
repeats: 3
timeout_s: 900
resource_limits:
  max_live_bytes: 536870912
  max_output_bytes: 536870912
  element_bytes: 4
  max_tasks: 512
