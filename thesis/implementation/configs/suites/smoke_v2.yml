schema_version: 2
suite_id: smoke_v2

defaults:
  warmups: 0
  repeats: 2
  timeout_s: 30
  memory_guard_gib: 2
  planner:
    engine: opt_einsum
    optimize: greedy

workloads:
  - id: bell_2q
    circuit:
      kind: builtin
      name: bell_2q

  - id: ghz_4q
    circuit:
      kind: builtin
      name: ghz_chain
      n_qubits: 4

routes:
  - id: cpu_tn_einsum_exact
    role: reference
    required: true

  - id: upmem_dense_int8_placeholder
    role: candidate
    required: false

validation:
  reference_route: cpu_tn_einsum_exact
  require_output_for_roles:
    - reference
    - candidate
  tolerances:
    max_abs_error: 1.0e-9
    l2_error: 1.0e-8
    max_rel_error: 1.0e-8
    norm_drift: 1.0e-8
    min_fidelity: 0.999999999
