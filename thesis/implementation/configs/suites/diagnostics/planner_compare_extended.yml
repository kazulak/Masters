schema_version: 2
suite_id: planner_compare_extended

defaults:
  warmups: 0
  repeats: 1
  timeout_s: 30
  memory_guard_gib: 2
  planner:
    engine: opt_einsum
    optimize: greedy

planner_comparison:
  planners:
    - engine: opt_einsum
      optimize: greedy
    - engine: opt_einsum
      optimize: auto
    - engine: opt_einsum
      optimize: random-greedy
  scoring:
    transfer_weight: 1.0
    memory_weight: 1.0
    tiling_weight: 1.0
    unsupported_weight: 10.0
    missing_estimate_weight: 10.0
    parallelism_bonus_weight: 0.25

workloads:
  - id: ghz_4q
    circuit:
      kind: builtin
      name: ghz_chain
      n_qubits: 4

  - id: ghz_5q
    circuit:
      kind: builtin
      name: ghz_chain
      n_qubits: 5

  - id: bv_4q
    circuit:
      kind: builtin
      name: BV
      n_qubits: 4

  - id: bv_5q
    circuit:
      kind: builtin
      name: BV
      n_qubits: 5

  - id: bv_6q
    circuit:
      kind: builtin
      name: BV
      n_qubits: 6

  - id: xor_4q
    circuit:
      kind: builtin
      name: XOR
      n_qubits: 4

  - id: xor_5q
    circuit:
      kind: builtin
      name: XOR
      n_qubits: 5

  - id: xor_6q
    circuit:
      kind: builtin
      name: XOR
      n_qubits: 6

  - id: qrng_4q
    circuit:
      kind: builtin
      name: QRNG
      n_qubits: 4

  - id: edc_4q
    circuit:
      kind: builtin
      name: EDC
      n_qubits: 4

routes:
  - id: cpu_tn_einsum_exact
    role: reference
    required: true

validation:
  reference_route: cpu_tn_einsum_exact
  require_output_for_roles:
    - reference
  tolerances:
    max_abs_error: 1.0e-9
    l2_error: 1.0e-8
    max_rel_error: 1.0e-8
    norm_drift: 1.0e-8
    min_fidelity: 0.999999999
