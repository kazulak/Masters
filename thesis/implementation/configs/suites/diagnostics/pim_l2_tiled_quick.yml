schema_version: 2
suite_id: pim_l2_tiled_quick

defaults:
  warmups: 0
  repeats: 1
  timeout_s: 60
  memory_guard_gib: 4
  planner:
    engine: synthetic_pressure
    optimize: synthetic_pressure

workloads:
  - id: synthetic_l2_square
    metadata:
      workload_type: synthetic_pressure
      execution_scope: model_only
      not_real_quantum_circuit: true
      pressure_scale: 2
      developer_bridge_payload: true
    circuit:
      kind: synthetic_pressure
      name: synthetic_l2_square
      profile: single_gemm
      task_count: 1
      gemm_m: 96
      gemm_k: 96
      gemm_n: 96

  - id: synthetic_l2_rect
    metadata:
      workload_type: synthetic_pressure
      execution_scope: model_only
      not_real_quantum_circuit: true
      pressure_scale: 2
      developer_bridge_payload: true
    circuit:
      kind: synthetic_pressure
      name: synthetic_l2_rect
      profile: single_gemm
      task_count: 1
      gemm_m: 128
      gemm_k: 128
      gemm_n: 64

  - id: synthetic_l2_kheavy
    metadata:
      workload_type: synthetic_pressure
      execution_scope: model_only
      not_real_quantum_circuit: true
      pressure_scale: 2
      developer_bridge_payload: true
    circuit:
      kind: synthetic_pressure
      name: synthetic_l2_kheavy
      profile: single_gemm
      task_count: 1
      gemm_m: 72
      gemm_k: 512
      gemm_n: 32

routes:
  - id: cpu_tn_einsum_exact
    role: reference
    required: false

validation:
  reference_route: cpu_tn_einsum_exact
  tolerances:
    max_abs_error: 1.0e-9
    l2_error: 1.0e-8
    max_rel_error: 1.0e-8
    norm_drift: 1.0e-8
    min_fidelity: 0.999999999
