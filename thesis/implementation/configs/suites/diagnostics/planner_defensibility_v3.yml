schema_version: 2
suite_id: planner_defensibility_v3

metadata:
  purpose: planner_defensibility_v3_diagnostics
  execution_tier: modeled_planning_only
  manual_invocation_required: false
  notes: >
    Diagnostic comparison suite for planner defensibility v3, comparing opt_einsum
    greedy+optimal, cotengra flops/size/write/combo, custom v2 projected-prefix
    greedy, and exact_modeled. Every route is explicitly modeled/unexecuted.

defaults:
  warmups: 0
  repeats: 1
  planner:
    engine: opt_einsum
    optimize: greedy

planner_comparison:
  pim_objective:
    objective_version: upmem_path_cost_v2
    weight_profile: balanced_literature_informed
    normalization: fixed_log1p_generic_budgets_v2
    execution_policy: generic_single_dpu_split_complex_v2
  planners:
    - engine: opt_einsum
      optimize: greedy
    - engine: opt_einsum
      optimize: optimal
    - engine: cotengra
      objective: flops
      methods: greedy
      max_repeats: 1
      seed: 0
    - engine: cotengra
      objective: size
      methods: greedy
      max_repeats: 1
      seed: 0
    - engine: cotengra
      objective: write
      methods: greedy
      max_repeats: 1
      seed: 0
    - engine: cotengra
      objective: combo
      methods: greedy
      max_repeats: 1
      seed: 0
    - engine: custom_upmem
      algorithm: greedy
      objective_version: upmem_path_cost_v2
      selection_scope: projected_prefix
      weight_profile: balanced_literature_informed
      normalization: fixed_log1p_generic_budgets_v2
      execution_policy: generic_single_dpu_split_complex_v2
    - engine: exact_modeled
      max_input_tensors: 6
      objective_version: upmem_path_cost_v2
      weight_profile: balanced_literature_informed
      normalization: fixed_log1p_generic_budgets_v2
      execution_policy: generic_single_dpu_split_complex_v2

workloads:
  - id: planner_motif_chain
    circuit: {kind: planner_motif, name: chain}
    metadata: {workload_type: synthetic_planner_motif, execution_scope: model_only, not_real_quantum_circuit: true}
  - id: planner_motif_flop_memory_tradeoff
    circuit: {kind: planner_motif, name: flop_memory_tradeoff}
    metadata: {workload_type: synthetic_planner_motif, execution_scope: model_only, not_real_quantum_circuit: true}
  - id: qrng_3q
    circuit:
      kind: builtin
      name: qrng
      n_qubits: 3

routes:
  - id: cpu_tn_einsum_exact
    role: planning_reference_only
    benchmark_role: diagnostic_internal_only
    required: false

validation:
  reference_route: cpu_tn_einsum_exact
  require_output_for_roles: []
