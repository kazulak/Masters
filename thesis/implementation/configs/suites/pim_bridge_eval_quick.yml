schema_version: 2
suite_id: pim_bridge_eval_quick

defaults:
  warmups: 0
  repeats: 1
  timeout_s: 60
  memory_guard_gib: 4
  planner:
    engine: opt_einsum
    optimize: greedy

workloads:
  - id: bell_2q
    circuit:
      kind: builtin
      name: bell_2q

  - id: ghz_3q
    circuit:
      kind: builtin
      name: ghz_chain
      n_qubits: 3

  - id: qrng_3q
    circuit:
      kind: builtin
      name: QRNG
      n_qubits: 3

  - id: bv_4q
    circuit:
      kind: builtin
      name: BV
      n_qubits: 4

  - id: bb84_4q
    circuit:
      kind: builtin
      name: BB84
      n_qubits: 4

  - id: edc_4q
    circuit:
      kind: builtin
      name: EDC
      n_qubits: 4

routes:
  - id: cpu_tn_einsum_exact
    role: reference
    required: true

validation:
  reference_route: cpu_tn_einsum_exact
  require_output_for_roles:
    - reference
  tolerances:
    max_abs_error: 1.0e-9
    l2_error: 1.0e-8
    max_rel_error: 1.0e-8
    norm_drift: 1.0e-8
    min_fidelity: 0.999999999
