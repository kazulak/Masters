schema_version: 2
suite_id: upmem_generic_medium

metadata:
  purpose: bounded_generic_upmem_runtime_coverage_and_quantization_attribution
  expected_runtime_class: local_medium
  expected_memory_class: small
  intended_use: developer_benchmark
  deterministic_unitary_only: true
  execution_target: upmem
  upmem_execution_mode: sdk_simulator
  notes: >
    This suite is for explicit UPMEM SDK generic-loop feasibility and MVP
    benchmark runs. Normal suite routes are not executed by upmem-mvp-benchmark.

defaults:
  warmups: 0
  repeats: 1
  timeout_s: 240
  memory_guard_gib: 8
  planner:
    engine: opt_einsum
    optimize: greedy

workloads:
  - id: qrng_5q_generic_supported
    circuit: {kind: builtin, name: QRNG, n_qubits: 5}
  - id: qrng_6q_generic_supported
    circuit: {kind: builtin, name: QRNG, n_qubits: 6}
  - id: bb84_5q_generic_supported
    circuit: {kind: builtin, name: BB84, n_qubits: 5}
  - id: edc_4q_generic_supported
    circuit: {kind: builtin, name: EDC, n_qubits: 4}
  - id: ghz_4q_generic_supported
    circuit: {kind: builtin, name: ghz_chain, n_qubits: 4}
  - id: bv_3q_generic_supported
    circuit: {kind: builtin, name: BV, n_qubits: 3}
  - id: xor_3q_generic_supported
    circuit: {kind: builtin, name: XOR, n_qubits: 3}
  - id: qrng_7q_generic_boundary
    circuit: {kind: builtin, name: QRNG, n_qubits: 7}
  - id: bb84_6q_generic_boundary
    circuit: {kind: builtin, name: BB84, n_qubits: 6}
  - id: edc_5q_generic_boundary
    circuit: {kind: builtin, name: EDC, n_qubits: 5}
  - id: ghz_5q_generic_boundary
    circuit: {kind: builtin, name: ghz_chain, n_qubits: 5}

routes:
  - id: cpu_tn_einsum_exact
    role: reference
    required: true

validation:
  reference_route: cpu_tn_einsum_exact
  tolerances:
    max_abs_error: 2.5e-1
    l2_error: 2.0
    max_rel_error: 10.0
    norm_drift: 2.0
    min_fidelity: 0.0
