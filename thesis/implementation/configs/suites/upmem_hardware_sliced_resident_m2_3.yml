    role: required_manual_hardware_m2_3_path_and_numeric_modes
    required: true
    options:
      backend_id: upmem_sdk_hardware_sliced_resident_two_dpu
      numeric_modes: [none, per_task_resident_requantize]
      slices: 2
      requested_dpu_count: 2
      tasklets_per_dpu: 1

path_variants:
