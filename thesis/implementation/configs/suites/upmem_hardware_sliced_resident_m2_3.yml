  fixture_scope: three_operation_ry_h_ry_full_graph_replicated_prefix
  require_nonzero_slice_partials: true
  native_hardware_profile_version: hardware_sliced_resident_two_dpu_m2_v1
  claim_boundary: fixed_modeled_candidate_paths_executed_on_two_dpu_sliced_resident_route_not_planner_optimization_evidence_no_speedup_scaling_concurrency_or_energy_claim
