    synchronous_execution: true
    device_launch_mode: asynchronous_dpu_set
    host_completion_mode: blocking_sync
    timeout_s: 30.0
    performance_claim_applicable: false

defaults:
  warmups: 1
  repeats: 5
  timeout_s: 30.0
  planner: {engine: opt_einsum, optimize: greedy}

routes:
