schema_version: 2
suite_id: simulation_backend_compare_upmem_sdk_simulator

metadata:
  purpose: strict_upmem_sdk_simulator_quantized_comparison
  expected_runtime_class: local_upmem_sdk_simulator_seconds
  expected_memory_class: small_statevector
  intended_use: upmem_sdk_simulator_validation
  deterministic_unitary_only: true
  validation_tier: quantized_codepath
  validation_method: full_statevector_quantized_tolerance
  statevector_cap_qubits: 4
  statevector_cap_amplitudes: 16
  max_qubits: 4
  notes: Minimal suite for comparing QuEST CPU, Quimb TN, and strict quantized UPMEM SDK simulator TaskGraph runtime. GPU is intentionally separate.

defaults:
  warmups: 0
  repeats: 1
  timeout_s: 180
  memory_guard_gib: 4
  planner:
    engine: opt_einsum
    optimize: greedy

workloads:
  - id: quest_qrng_3q
    circuit: {kind: quest_compatible, name: QRNG, n_qubits: 3}

  - id: quest_qrng_4q
    circuit: {kind: quest_compatible, name: QRNG, n_qubits: 4}

routes:
  - id: quest_cpu_full_state_exact
    role: comparison_anchor
    benchmark_role: serious_full_state_baseline
    route_role_description: Serious QuEST CPU full-state comparison anchor.
    required: true
    options:
      max_output_qubits: 4
      max_output_amplitudes: 16
      max_output_bytes: 256

  - id: quimb_tn_exact
    role: baseline
    benchmark_role: serious_external_tn_baseline
    route_role_description: External tensor-network baseline for exact-output comparison.
    required: true
    options:
      optimize: greedy

  - id: upmem_tn_sdk_simulator_quantized
    role: optional_upmem_candidate
    benchmark_role: strict_upmem_sdk_simulator_quantized
    route_role_description: Strict quantized UPMEM SDK TaskGraph runtime using SDK simulator mode.
    route_limitation_scope: Quantized int8/int32 per-task input execution; SDK simulator mode only, no hardware timing.
    required: false
    options:
      execute_external: true
      policy: dense-then-generic
      quantization_mode: per_task_input_quantize

validation:
  reference_route: quest_cpu_full_state_exact
  require_output_for_roles:
    - comparison_anchor
    - baseline
  tolerances:
    max_abs_error: 0.25
    l2_error: 2.0
    max_rel_error: 10.0
    norm_drift: 2.0
    min_fidelity: 0.0
