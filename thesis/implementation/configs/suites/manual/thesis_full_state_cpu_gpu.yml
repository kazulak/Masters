schema_version: 2
suite_id: thesis_full_state_cpu_gpu

metadata:
  purpose: thesis_full_state_cpu_gpu_direct_comparison
  expected_runtime_class: manual_gpu_minutes
  expected_memory_class: bounded_statevector_no_dump
  intended_use: thesis_evidence_full_state_cpu_gpu
  deterministic_unitary_only: true
  manual_invocation_required: true
  gpu_execution_suite: true
  requires_verified_gpu_for_gpu_rows: true
  validation_method: native_status_gate_counts
  state_output_mode: none
  performance_tier: true
  output_contract: metrics_only
  exact_output_comparable: false
  full_statevector_validation_available: false
  max_qubits: 20
  notes: >
    Thesis CPU/GPU full-state performance suite. This suite must be run
    manually in a GPU-visible environment; Codex cannot run it when /dev/kfd
    and /dev/dri are hidden.

defaults:
  warmups: 1
  repeats: 5
  timeout_s: 1200
  memory_guard_gib: 24
  planner:
    engine: opt_einsum
    optimize: greedy

