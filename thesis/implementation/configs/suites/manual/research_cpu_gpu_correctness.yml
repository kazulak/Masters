schema_version: 2
suite_id: research_cpu_gpu_correctness

metadata:
  purpose: research_cpu_gpu_full_state_correctness
  expected_runtime_class: manual_gpu_minutes
  expected_memory_class: bounded_statevector
  intended_use: thesis_research_correctness
  deterministic_unitary_only: true
  manual_invocation_required: true
  gpu_execution_suite: true
  requires_verified_gpu_for_gpu_rows: true
  validation_tier: correctness_full_statevector
  validation_method: full_statevector
  state_output_mode: full_dump
  performance_tier: false
  statevector_cap_qubits: 16
  statevector_cap_amplitudes: 65536
  canonical_circuit_families: [QRNG, BV, XOR, BB84, EDC, HS]
  correctness_qubit_sizes: [4, 8, 12, 16]
  max_qubits: 16
  notes: Full-output correctness tier for the CPU/GPU performance route.

defaults:
  warmups: 0
  repeats: 1
  timeout_s: 600
  memory_guard_gib: 16
  planner:
    engine: opt_einsum
    optimize: greedy

workloads:
  - {id: quest_qrng_4q_research_correctness, circuit: {kind: quest_compatible, name: QRNG, n_qubits: 4, repeat_layers: 4}}
  - {id: quest_qrng_8q_research_correctness, circuit: {kind: quest_compatible, name: QRNG, n_qubits: 8, repeat_layers: 4}}
  - {id: quest_qrng_12q_research_correctness, circuit: {kind: quest_compatible, name: QRNG, n_qubits: 12, repeat_layers: 4}}
  - {id: quest_qrng_16q_research_correctness, circuit: {kind: quest_compatible, name: QRNG, n_qubits: 16, repeat_layers: 4}}
  - {id: quest_bv_4q_research_correctness, circuit: {kind: quest_compatible, name: BV, n_qubits: 4, repeat_layers: 4}}
  - {id: quest_bv_8q_research_correctness, circuit: {kind: quest_compatible, name: BV, n_qubits: 8, repeat_layers: 4}}
  - {id: quest_bv_12q_research_correctness, circuit: {kind: quest_compatible, name: BV, n_qubits: 12, repeat_layers: 4}}
  - {id: quest_bv_16q_research_correctness, circuit: {kind: quest_compatible, name: BV, n_qubits: 16, repeat_layers: 4}}
  - {id: quest_xor_4q_research_correctness, circuit: {kind: quest_compatible, name: XOR, n_qubits: 4, repeat_layers: 8}}
  - {id: quest_xor_8q_research_correctness, circuit: {kind: quest_compatible, name: XOR, n_qubits: 8, repeat_layers: 8}}
  - {id: quest_xor_12q_research_correctness, circuit: {kind: quest_compatible, name: XOR, n_qubits: 12, repeat_layers: 8}}
  - {id: quest_xor_16q_research_correctness, circuit: {kind: quest_compatible, name: XOR, n_qubits: 16, repeat_layers: 8}}
  - {id: quest_bb84_4q_research_correctness, circuit: {kind: quest_compatible, name: BB84, n_qubits: 4, repeat_layers: 4}}
  - {id: quest_bb84_8q_research_correctness, circuit: {kind: quest_compatible, name: BB84, n_qubits: 8, repeat_layers: 4}}
  - {id: quest_bb84_12q_research_correctness, circuit: {kind: quest_compatible, name: BB84, n_qubits: 12, repeat_layers: 4}}
  - {id: quest_bb84_16q_research_correctness, circuit: {kind: quest_compatible, name: BB84, n_qubits: 16, repeat_layers: 4}}
  - {id: quest_edc_4q_research_correctness, circuit: {kind: quest_compatible, name: EDC, n_qubits: 4, repeat_layers: 4}}
  - {id: quest_edc_8q_research_correctness, circuit: {kind: quest_compatible, name: EDC, n_qubits: 8, repeat_layers: 4}}
  - {id: quest_edc_12q_research_correctness, circuit: {kind: quest_compatible, name: EDC, n_qubits: 12, repeat_layers: 4}}
  - {id: quest_edc_16q_research_correctness, circuit: {kind: quest_compatible, name: EDC, n_qubits: 16, repeat_layers: 4}}
  - {id: quest_hs_4q_research_correctness, circuit: {kind: quest_compatible, name: HS, allocated_qubits: 4, logical_qubits: 2, repeat_layers: 4}}
  - {id: quest_hs_8q_research_correctness, circuit: {kind: quest_compatible, name: HS, allocated_qubits: 8, logical_qubits: 4, repeat_layers: 4}}
  - {id: quest_hs_12q_research_correctness, circuit: {kind: quest_compatible, name: HS, allocated_qubits: 12, logical_qubits: 6, repeat_layers: 4}}
  - {id: quest_hs_16q_research_correctness, circuit: {kind: quest_compatible, name: HS, allocated_qubits: 16, logical_qubits: 8, repeat_layers: 4}}

routes:
  - id: quest_cpu_full_state_exact
    role: comparison_anchor
    benchmark_role: serious_full_state_baseline
    required: true
    options:
      state_output_mode: full_dump
      validation_method: full_statevector
      performance_tier: false
      max_output_qubits: 16
      max_output_amplitudes: 65536
      max_output_bytes: 1048576

  - id: quest_gpu_full_state_exact
    role: gpu_baseline
    benchmark_role: serious_gpu_full_state_baseline
    required: true
    options:
      state_output_mode: full_dump
      validation_method: full_statevector
      performance_tier: false
      max_output_qubits: 16
      max_output_amplitudes: 65536
      max_output_bytes: 1048576

validation:
  reference_route: quest_cpu_full_state_exact
  require_output_for_roles:
    - comparison_anchor
    - gpu_baseline
  tolerances:
    max_abs_error: 1.0e-9
    l2_error: 1.0e-8
    max_rel_error: 1.0e-8
    norm_drift: 1.0e-8
    min_fidelity: 0.999999999
