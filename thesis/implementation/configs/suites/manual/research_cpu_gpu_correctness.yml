schema_version: 2
suite_id: research_cpu_gpu_correctness

metadata:
  purpose: research_cpu_gpu_full_state_correctness
  expected_runtime_class: manual_gpu_minutes
  expected_memory_class: bounded_statevector
  intended_use: thesis_research_correctness
  deterministic_unitary_only: true
  manual_invocation_required: true
  gpu_execution_suite: true
  requires_verified_gpu_for_gpu_rows: true
  validation_tier: correctness_full_statevector
  validation_method: full_statevector
  state_output_mode: full_dump
  performance_tier: false
  statevector_cap_qubits: 12
  statevector_cap_amplitudes: 4096
  max_qubits: 12
  notes: Full-output correctness tier for the CPU/GPU performance route.

defaults:
  warmups: 1
  repeats: 3
  timeout_s: 600
  memory_guard_gib: 16
  planner:
    engine: opt_einsum
    optimize: greedy

workloads:
  - id: quest_bv_10q_research_correctness
    circuit: {kind: quest_compatible, name: BV, n_qubits: 10, repeat_layers: 8}
  - id: quest_bv_12q_research_correctness
    circuit: {kind: quest_compatible, name: BV, n_qubits: 12, repeat_layers: 8}
  - id: quest_xor_10q_research_correctness
    circuit: {kind: quest_compatible, name: XOR, n_qubits: 10, repeat_layers: 16}
  - id: quest_xor_12q_research_correctness
    circuit: {kind: quest_compatible, name: XOR, n_qubits: 12, repeat_layers: 16}
  - id: quest_edc_10q_research_correctness
    circuit: {kind: quest_compatible, name: EDC, n_qubits: 10, repeat_layers: 8}
  - id: quest_edc_12q_research_correctness
    circuit: {kind: quest_compatible, name: EDC, n_qubits: 12, repeat_layers: 8}
  - id: quest_hs_10q_research_correctness
    circuit: {kind: quest_compatible, name: HS, allocated_qubits: 10, logical_qubits: 5, repeat_layers: 8}
  - id: quest_hs_12q_research_correctness
    circuit: {kind: quest_compatible, name: HS, allocated_qubits: 12, logical_qubits: 6, repeat_layers: 8}

routes:
  - id: quest_cpu_full_state_exact
    role: comparison_anchor
    benchmark_role: serious_full_state_baseline
    required: true
    options:
      state_output_mode: full_dump
      validation_method: full_statevector
      performance_tier: false
      max_output_qubits: 12
      max_output_amplitudes: 4096
      max_output_bytes: 65536

  - id: quest_gpu_full_state_exact
    role: gpu_baseline
    benchmark_role: serious_gpu_full_state_baseline
    required: true
    options:
      state_output_mode: full_dump
      validation_method: full_statevector
      performance_tier: false
      max_output_qubits: 12
      max_output_amplitudes: 4096
      max_output_bytes: 65536

validation:
  reference_route: quest_cpu_full_state_exact
  require_output_for_roles:
    - comparison_anchor
    - gpu_baseline
  tolerances:
    max_abs_error: 1.0e-9
    l2_error: 1.0e-8
    max_rel_error: 1.0e-8
    norm_drift: 1.0e-8
    min_fidelity: 0.999999999
