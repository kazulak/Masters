schema_version: 2
suite_id: research_upmem_boundary

metadata:
  purpose: research_upmem_sdk_simulator_boundary
  expected_runtime_class: manual_upmem_sdk_simulator
  expected_memory_class: small_statevector
  intended_use: thesis_research_upmem_boundary
  deterministic_unitary_only: true
  manual_invocation_required: true
  validation_tier: quantized_codepath_boundary
  validation_method: full_statevector_quantized_tolerance
  statevector_cap_qubits: 6
  statevector_cap_amplitudes: 64
  max_qubits: 6
  notes: Strict UPMEM SDK simulator boundary evidence. Simulator timing is not hardware speedup.

defaults:
  warmups: 0
  repeats: 1
  timeout_s: 300
  memory_guard_gib: 8
  planner:
    engine: opt_einsum
    optimize: greedy

workloads:
  - id: quest_qrng_3q_upmem_boundary
    circuit: {kind: quest_compatible, name: QRNG, n_qubits: 3}
  - id: quest_qrng_4q_upmem_boundary
    circuit: {kind: quest_compatible, name: QRNG, n_qubits: 4}
  - id: quest_qrng_5q_upmem_boundary
    circuit: {kind: quest_compatible, name: QRNG, n_qubits: 5}
  - id: quest_bv_3q_upmem_boundary
    circuit: {kind: quest_compatible, name: BV, n_qubits: 3}
  - id: quest_bv_4q_upmem_boundary
    circuit: {kind: quest_compatible, name: BV, n_qubits: 4}
  - id: quest_xor_3q_upmem_boundary
    circuit: {kind: quest_compatible, name: XOR, n_qubits: 3}
  - id: quest_xor_4q_upmem_boundary
    circuit: {kind: quest_compatible, name: XOR, n_qubits: 4}
  - id: quest_edc_4q_upmem_boundary
    circuit: {kind: quest_compatible, name: EDC, n_qubits: 4}

routes:
  - id: quest_cpu_full_state_exact
    role: comparison_anchor
    benchmark_role: serious_full_state_baseline
    required: true
    options:
      max_output_qubits: 6
      max_output_amplitudes: 64
      max_output_bytes: 1024

  - id: upmem_tn_sdk_simulator_quantized
    role: upmem_boundary_candidate
    benchmark_role: strict_upmem_sdk_simulator_quantized
    route_role_description: Strict quantized UPMEM SDK TaskGraph runtime using SDK simulator mode.
    route_limitation_scope: Quantized int8/int32 per-task input execution; SDK simulator mode only, no hardware timing.
    required: false
    options:
      execute_external: true
      policy: generic-only
      quantization_mode: per_task_input_quantize

validation:
  reference_route: quest_cpu_full_state_exact
  require_output_for_roles:
    - comparison_anchor
  tolerances:
    max_abs_error: 0.25
    l2_error: 2.0
    max_rel_error: 10.0
    norm_drift: 2.0
    min_fidelity: 0.0
