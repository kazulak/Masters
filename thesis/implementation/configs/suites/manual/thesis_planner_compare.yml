schema_version: 2
suite_id: thesis_planner_compare

metadata:
  purpose: thesis_contraction_path_comparison
  expected_runtime_class: manual_cpu_minutes
  expected_memory_class: planning_only
  intended_use: thesis_evidence_planner_comparison
  deterministic_unitary_only: true
  manual_invocation_required: true
  execution_tier: modeled_planning_only
  canonical_circuit_families: [QRNG, BV, XOR, BB84, EDC, HS]
  canonical_qubit_sizes: [8, 10, 12, 14, 16, 18, 20]
  max_qubits: 20
  notes: >
    Compares deterministic opt_einsum planner choices for the six PIMutation
    circuit families and the canonical seven local sizes. No contraction is
    executed and no runtime speedup is claimed from these rows.

defaults:
  warmups: 0
  repeats: 1
  timeout_s: 600
  memory_guard_gib: 8
  planner:
    engine: opt_einsum
    optimize: greedy

planner_comparison:
  planners:
    - engine: opt_einsum
      optimize: greedy
    - engine: opt_einsum
      optimize: auto
  scoring:
    transfer_weight: 1.0
    memory_weight: 1.0
    tiling_weight: 1.0
    unsupported_weight: 10.0
    missing_estimate_weight: 10.0
    parallelism_bonus_weight: 0.25

workloads:
  - {id: quest_qrng_8q_planner, circuit: {kind: quest_compatible, name: QRNG, n_qubits: 8}}
