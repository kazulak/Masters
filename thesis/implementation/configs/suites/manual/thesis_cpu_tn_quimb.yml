schema_version: 2
suite_id: thesis_cpu_tn_quimb

metadata:
  purpose: thesis_external_cpu_tensor_network_comparison
  expected_runtime_class: manual_cpu_minutes
  expected_memory_class: bounded_tn_workstation
  intended_use: thesis_evidence_external_cpu_tn
  deterministic_unitary_only: true
  manual_invocation_required: true
  validation_method: full_statevector
  max_qubits: 20
  notes: >
    Thesis CPU tensor-network suite. Quimb unsliced/sliced routes are the
    serious CPU TN evidence. Internal TaskGraph/path replay routes are not
    included here because they are diagnostic attribution routes, not serious
    external TN baselines.

defaults:
  warmups: 0
  repeats: 3
  timeout_s: 1200
  memory_guard_gib: 12
  planner:
    engine: opt_einsum
    optimize: greedy

