routes:
  - id: quest_cpu_full_state_exact
    role: comparison_anchor
    benchmark_role: serious_full_state_baseline
    required: true
    options:
      max_output_qubits: 20
      max_output_amplitudes: 1048576
      max_output_bytes: 16777216

  - id: quimb_tn_exact
    role: baseline
    benchmark_role: serious_external_tn_baseline
    required: false
    options:
      optimize: greedy
      max_estimated_intermediate_bytes: 4294967296
      resource_skip_reason: thesis_tn_resource_guard
      allow_missing_estimate: true

  - id: quimb_tn_sliced_exact
    role: slicing_evidence
    benchmark_role: explicit_slicing_evidence
    required: false
    options:
      methods: greedy
      max_repeats: 1
      slicing_strategy: target_slices
      target_slices: 2
      require_slicing: true
      max_estimated_intermediate_bytes: 4294967296
      resource_skip_reason: thesis_tn_resource_guard
      allow_missing_estimate: true

validation:
  reference_route: quest_cpu_full_state_exact
  require_output_for_roles:
    - comparison_anchor
  tolerances:
    max_abs_error: 3.0e-1
    l2_error: 4.0
    max_rel_error: 10.0
    norm_drift: 4.0
    min_fidelity: 0.0
