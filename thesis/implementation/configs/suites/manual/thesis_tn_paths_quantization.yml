schema_version: 2
suite_id: thesis_tn_paths_quantization

metadata:
  purpose: thesis_tensor_network_path_and_quantization_comparison
  expected_runtime_class: manual_cpu_diagnostic_minutes
  expected_memory_class: bounded_taskgraph_replay
  intended_use: thesis_evidence_tn_path_quantization_diagnostic
  deterministic_unitary_only: true
  manual_invocation_required: true
  validation_method: full_statevector
  max_qubits: 20
  case_process_isolation: true
  notes: >
    Thesis diagnostic CPU tensor-network suite for same-path replay and
    per-contraction quantization attribution. This is not the serious external
    CPU TN baseline; use thesis_cpu_tn_quimb.yml for Quimb unsliced/sliced
    thesis evidence. Resource-heavy route/case pairs must be reported as
    skipped before execution rather than allowed to trigger workstation OOM
    kills.

defaults:
  warmups: 0
  repeats: 1
  timeout_s: 1200
  memory_guard_gib: 8
  planner:
    engine: opt_einsum
    optimize: greedy

workloads:
  - id: quest_qrng_8q_thesis_tn
    circuit: {kind: quest_compatible, name: QRNG, n_qubits: 8}
