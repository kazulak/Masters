routes:
  - id: quest_cpu_full_state_exact
    role: comparison_anchor
    benchmark_role: serious_full_state_baseline
    required: true
    options:
      max_output_qubits: 20
      max_output_amplitudes: 1048576
      max_output_bytes: 16777216

  - id: cpu_tn_path_replay_float64
    role: path_replay_baseline
    benchmark_role: diagnostic_path_replay_baseline
    required: false
    options:
      path_strategy: greedy
      max_estimated_intermediate_bytes: 1073741824
      resource_skip_reason: thesis_tn_diagnostic_replay_guard
      allow_missing_estimate: false

  - id: cpu_tn_path_replay_int8_quantized
    role: quantized_path_replay
    benchmark_role: diagnostic_quantized_path_replay
    required: false
    options:
      path_strategy: greedy
      max_estimated_intermediate_bytes: 1073741824
      resource_skip_reason: thesis_tn_diagnostic_replay_guard
      allow_missing_estimate: false

validation:
  reference_route: quest_cpu_full_state_exact
  require_output_for_roles:
    - comparison_anchor
  tolerances:
    max_abs_error: 3.0e-1
    l2_error: 4.0
    max_rel_error: 10.0
    norm_drift: 4.0
    min_fidelity: 0.0
