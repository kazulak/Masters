schema_version: 2
suite_id: thesis_tn_paths_quantization

metadata:
  purpose: thesis_tensor_network_path_and_quantization_comparison
  expected_runtime_class: manual_cpu_minutes
  expected_memory_class: bounded_tn_workstation
  intended_use: thesis_evidence_tn_paths_quantization
  deterministic_unitary_only: true
  manual_invocation_required: true
  validation_method: full_statevector
  max_qubits: 18
  notes: >
    Thesis CPU tensor-network suite. Quimb unsliced/sliced routes are the
    serious CPU TN evidence. Internal path replay routes are diagnostic
    attribution routes for contraction path and per-contraction quantization.

defaults:
  warmups: 1
  repeats: 3
  timeout_s: 1200
  memory_guard_gib: 24
  planner:
    engine: opt_einsum
    optimize: greedy

