routes:
  - id: quest_cpu_full_state_exact
    role: comparison_anchor
    benchmark_role: serious_full_state_baseline
    required: true
    options:
      max_output_qubits: 18
      max_output_amplitudes: 262144
      max_output_bytes: 4194304

  - id: quimb_tn_exact
    role: baseline
    benchmark_role: serious_external_tn_baseline
    required: false
    options:
      optimize: greedy
      max_estimated_intermediate_bytes: 25769803776
      allow_missing_estimate: true

  - id: quimb_tn_sliced_exact
    role: slicing_evidence
    benchmark_role: explicit_slicing_evidence
    required: false
    options:
      methods: greedy
      max_repeats: 1
      slicing_strategy: target_slices
      target_slices: 2
      require_slicing: true
      max_estimated_intermediate_bytes: 25769803776
      allow_missing_estimate: true

  - id: cpu_tn_path_replay_float64
    role: path_replay_baseline
    benchmark_role: diagnostic_path_replay_baseline
    required: false
    options:
      path_strategy: greedy
      max_estimated_intermediate_bytes: 8589934592
      allow_missing_estimate: true

  - id: cpu_tn_path_replay_int8_quantized
    role: quantized_path_replay
    benchmark_role: diagnostic_quantized_path_replay
    required: false
    options:
      path_strategy: greedy
      max_estimated_intermediate_bytes: 8589934592
      allow_missing_estimate: true

validation:
  reference_route: quest_cpu_full_state_exact
  require_output_for_roles:
    - comparison_anchor
  tolerances:
    max_abs_error: 3.0e-1
    l2_error: 4.0
    max_rel_error: 10.0
    norm_drift: 4.0
    min_fidelity: 0.0
