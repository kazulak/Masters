schema_version: 2
suite_id: research_internal_parallelism

metadata:
  purpose: research_internal_taskgraph_parallelism_diagnostics
  expected_runtime_class: manual_cpu_minutes
  expected_memory_class: diagnostic_bounded
  intended_use: diagnostics
  deterministic_unitary_only: true
  manual_invocation_required: true
  validation_method: full_statevector
  notes: Diagnostic architecture evidence only; not a serious CPU TN baseline.

defaults:
  warmups: 0
  repeats: 1
  timeout_s: 300
  memory_guard_gib: 8
  planner:
    engine: opt_einsum
    optimize: greedy

workloads:
  - id: quest_bv_6q_internal_diag
    circuit: {kind: quest_compatible, name: BV, n_qubits: 6}
  - id: quest_bv_8q_internal_diag
    circuit: {kind: quest_compatible, name: BV, n_qubits: 8}
  - id: quest_xor_6q_internal_diag
    circuit: {kind: quest_compatible, name: XOR, n_qubits: 6}
  - id: quest_xor_8q_internal_diag
    circuit: {kind: quest_compatible, name: XOR, n_qubits: 8}
  - id: quest_edc_6q_internal_diag
    circuit: {kind: quest_compatible, name: EDC, n_qubits: 6}
  - id: quest_hs_8q_internal_diag
    circuit: {kind: quest_compatible, name: HS, allocated_qubits: 8, logical_qubits: 4}

routes:
  - id: quest_cpu_full_state_exact
    role: comparison_anchor
    benchmark_role: serious_full_state_baseline
    required: true

  - id: cpu_tn_einsum_exact
    role: diagnostic_sequential
    benchmark_role: internal_debug_baseline
    required: true

  - id: cpu_tn_frontier_exact
    role: diagnostic_frontier
    benchmark_role: internal_frontier_diagnostic
    required: true
    options:
      frontier_worker_count: 2

  - id: cpu_tn_hybrid_sliced_frontier_exact
    role: diagnostic_hybrid
    benchmark_role: internal_hybrid_diagnostic
    required: true
    options:
      frontier_worker_count: 2
      max_slice_count: 2

validation:
  reference_route: quest_cpu_full_state_exact
  require_output_for_roles:
    - comparison_anchor
    - diagnostic_sequential
    - diagnostic_frontier
    - diagnostic_hybrid
  tolerances:
    max_abs_error: 1.0e-9
    l2_error: 1.0e-8
    max_rel_error: 1.0e-8
    norm_drift: 1.0e-8
    min_fidelity: 0.999999999
