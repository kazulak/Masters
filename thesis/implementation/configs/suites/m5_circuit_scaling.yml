  - id: upmem_physical_1rank_32dpu
    engine: m5_whole_circuit_v4
    label: UPMEM physical, 1 rank, 32 DPU
    topology: {backend: upmem, rank_paths: [/dev/dpu_rank0], dpus: 32, tasklets_per_device: 1}
    timeout_enforcement: engine_subprocess
