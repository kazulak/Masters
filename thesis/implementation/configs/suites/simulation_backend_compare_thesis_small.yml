schema_version: 2
suite_id: simulation_backend_compare_thesis_small

metadata:
  purpose: bounded_local_thesis_backend_comparison
  expected_runtime_class: local_minutes
  statevector_cap_qubits: 8
  statevector_cap_amplitudes: 256
  deterministic_unitary_only: true

defaults:
  warmups: 0
  repeats: 1
  timeout_s: 120
  memory_guard_gib: 6
  planner:
    engine: opt_einsum
    optimize: greedy

workloads:
  - id: quest_qrng_3q
    circuit: {kind: quest_compatible, name: QRNG, n_qubits: 3}
  - id: quest_qrng_5q
    circuit: {kind: quest_compatible, name: QRNG, n_qubits: 5}
  - id: quest_bb84_3q
    circuit: {kind: quest_compatible, name: BB84, n_qubits: 3}
  - id: quest_bb84_5q
    circuit: {kind: quest_compatible, name: BB84, n_qubits: 5}
  - id: quest_bv_4q
    circuit: {kind: quest_compatible, name: BV, n_qubits: 4}
  - id: quest_bv_6q
    circuit: {kind: quest_compatible, name: BV, n_qubits: 6}
  - id: quest_edc_4q
    circuit: {kind: quest_compatible, name: EDC, n_qubits: 4}
  - id: quest_edc_6q
    circuit: {kind: quest_compatible, name: EDC, n_qubits: 6}
  - id: quest_xor_4q
    circuit: {kind: quest_compatible, name: XOR, n_qubits: 4}
  - id: quest_xor_6q
    circuit: {kind: quest_compatible, name: XOR, n_qubits: 6}
  - id: quest_hs_4q
    circuit: {kind: quest_compatible, name: HS, allocated_qubits: 4, logical_qubits: 2}

routes:
  - id: cpu_tn_einsum_exact
    role: baseline
    required: true

  - id: quest_cpu_full_state_exact
    role: comparison_anchor
    required: true
    options:
      max_output_qubits: 8
      max_output_amplitudes: 256
      max_output_bytes: 4096

  - id: quimb_tn_exact
    role: baseline
    required: true
    options:
      optimize: greedy

validation:
  reference_route: quest_cpu_full_state_exact
  require_output_for_roles:
    - baseline
    - comparison_anchor
  tolerances:
    max_abs_error: 1.0e-9
    l2_error: 1.0e-8
    max_rel_error: 1.0e-8
    norm_drift: 1.0e-8
    min_fidelity: 0.999999999
