routes:
  - id: quest_cpu_full_state_exact
    role: comparison_anchor
    benchmark_role: serious_full_state_baseline
    route_role_description: Serious QuEST CPU full-state comparison anchor.
    required: true
    options:
      max_output_qubits: 18
      max_output_amplitudes: 262144
      max_output_bytes: 4194304

  - id: quest_gpu_full_state_exact
    role: gpu_baseline
    benchmark_role: serious_gpu_full_state_baseline
    route_role_description: Verified QuEST HIP GPU full-state route for direct CPU/GPU comparison.
    required: true
    options:
      max_output_qubits: 18
      max_output_amplitudes: 262144
      max_output_bytes: 4194304

validation:
  reference_route: quest_cpu_full_state_exact
  require_output_for_roles:
    - comparison_anchor
    - gpu_baseline
  tolerances:
    max_abs_error: 1.0e-9
    l2_error: 1.0e-8
    max_rel_error: 1.0e-8
    norm_drift: 1.0e-8
    min_fidelity: 0.999999999
