schema_version: 2
suite_id: simulation_backend_compare_compute_medium

metadata:
  purpose: compute_focused_cpu_backend_comparison
  expected_runtime_class: local_minutes
  deterministic_unitary_only: true
  gpu_independent: true
  validation_tier: performance
  validation_method: full_statevector
  statevector_cap_qubits: 8
  statevector_cap_amplitudes: 256
  notes: CPU-only/no-ROCm environments must run this suite successfully.

defaults:
  warmups: 1
  repeats: 3
  timeout_s: 240
  memory_guard_gib: 8
  planner:
    engine: opt_einsum
    optimize: greedy

workloads:
  - id: quest_qrng_8q
    circuit: {kind: quest_compatible, name: QRNG, n_qubits: 8}
  - id: quest_bb84_8q
    circuit: {kind: quest_compatible, name: BB84, n_qubits: 8}
  - id: quest_bv_8q
    circuit: {kind: quest_compatible, name: BV, n_qubits: 8}
  - id: quest_edc_8q
    circuit: {kind: quest_compatible, name: EDC, n_qubits: 8}
  - id: quest_xor_8q
    circuit: {kind: quest_compatible, name: XOR, n_qubits: 8}
  - id: quest_hs_8q
    circuit: {kind: quest_compatible, name: HS, allocated_qubits: 8, logical_qubits: 4}

routes:
  - id: quest_cpu_full_state_exact
    role: comparison_anchor
    benchmark_role: serious_full_state_baseline
    route_role_description: Serious QuEST CPU full-state comparison anchor.
    required: true
    options:
      max_output_qubits: 8
      max_output_amplitudes: 256
      max_output_bytes: 4096

  - id: quimb_tn_exact
    role: baseline
    benchmark_role: serious_external_tn_baseline
    route_role_description: Primary CPU tensor-network baseline for compute-focused suites.
    required: true
    options:
      optimize: greedy

validation:
  reference_route: quest_cpu_full_state_exact
  require_output_for_roles:
    - baseline
    - comparison_anchor
  tolerances:
    max_abs_error: 1.0e-9
    l2_error: 1.0e-8
    max_rel_error: 1.0e-8
    norm_drift: 1.0e-8
    min_fidelity: 0.999999999
