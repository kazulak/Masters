schema_version: tn_benchmark_v3
experiment_id: m7c-scaling-confirmation-ghz18
defaults:
  timeout_s: 120.0
collection:
  claim_policy: diagnostic_v1
  base_seed: 20260827
  warmup_blocks: 1
  measurement_blocks: 5
  session_policy: fresh_session_per_attempt_v1
  block_cooldown_s: 0.0
  machine_policy:
    machine_exclusivity:
      mode: observed_v1
    cpu_governor:
      mode: observed_v1
    affinity:
      mode: observed_v1
      expected_cpus: null
    numa_policy:
      mode: observed_v1
    background_load:
      mode: observed_v1
      max_load1_per_online_cpu: null
cases:
  scaling_secondary:
    circuit:
      kind: builtin
      name: ghz_chain
      path: null
      parameters:
        n_qubits: 18
plans:
  greedy:
    planner:
      engine: opt_einsum
      mode: greedy
    slicing: null
routes:
  upmem_float32_1dpu_t1:
    executor: upmem_physical
    numeric_policy: split_complex_float32_v1
    options:
      dpu_count: 1
      rank_count: 1
      tasklets_per_dpu: 1
      session_root: ../runs/upmem_sessions/scaling_confirmation_t1
      host_binary: ../native/upmem/runtime/bin/host_upmem_execution_plan_v4_t1
      dpu_binary: ../native/upmem/runtime/bin/dpu_gemm_tile_v4_t1
      rank_paths: [/dev/dpu_rank0]
  upmem_float32_1dpu_t8:
    executor: upmem_physical
    numeric_policy: split_complex_float32_v1
    options:
      dpu_count: 1
      rank_count: 1
      tasklets_per_dpu: 8
      session_root: ../runs/upmem_sessions/scaling_confirmation_t8_1dpu
      host_binary: ../native/upmem/runtime/bin/host_upmem_execution_plan_v4_t8
      dpu_binary: ../native/upmem/runtime/bin/dpu_gemm_tile_v4_t8
      rank_paths: [/dev/dpu_rank0]
  upmem_float32_2dpu_t8:
    executor: upmem_physical
    numeric_policy: split_complex_float32_v1
    options:
      dpu_count: 2
      rank_count: 1
      tasklets_per_dpu: 8
      session_root: ../runs/upmem_sessions/scaling_confirmation_t8_2dpu
      host_binary: ../native/upmem/runtime/bin/host_upmem_execution_plan_v4_t8
      dpu_binary: ../native/upmem/runtime/bin/dpu_gemm_tile_v4_t8
      rank_paths: [/dev/dpu_rank0]
  upmem_float32_4dpu_t8:
    executor: upmem_physical
    numeric_policy: split_complex_float32_v1
    options:
      dpu_count: 4
      rank_count: 1
      tasklets_per_dpu: 8
      session_root: ../runs/upmem_sessions/scaling_confirmation_t8_4dpu
      host_binary: ../native/upmem/runtime/bin/host_upmem_execution_plan_v4_t8
      dpu_binary: ../native/upmem/runtime/bin/dpu_gemm_tile_v4_t8
      rank_paths: [/dev/dpu_rank0]
matrix:
  - case_id: scaling_secondary
    plan_id: greedy
    route_ids:
      - upmem_float32_1dpu_t1
      - upmem_float32_1dpu_t8
      - upmem_float32_2dpu_t8
      - upmem_float32_4dpu_t8
