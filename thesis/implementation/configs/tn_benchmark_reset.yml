schema_version: tn_benchmark_v2
experiment_id: reset-smoke
defaults:
  timeout_s: 120.0
collection:
  base_seed: 20260825
  warmup_blocks: 1
  measurement_blocks: 3
  session_policy: fresh_session_per_attempt_v1
  cooldown_s: 0.0
  machine_policy:
    machine_exclusivity: observed_v1
    cpu_governor: observed_v1
    affinity: observed_v1
    numa_policy: observed_v1
    background_load: observed_v1
cases:
  bell:
    circuit:
      kind: builtin
      name: bell_2q
      path: null
      parameters: {}
plans:
  greedy:
    planner:
      engine: opt_einsum
      mode: greedy
      max_repeats: 1
      seed: 0
    slicing: null
routes:
  numpy_float32:
    executor: numpy_dag
    numeric_policy: split_complex_float32_v1
    options: {}
  quimb:
    executor: quimb
    numeric_policy: null
    options:
      optimize: greedy
  cotengra:
    executor: cotengra
    numeric_policy: null
    options:
      methods: greedy
      max_repeats: 1
matrix:
  - case_id: bell
    plan_id: greedy
    route_ids: [numpy_float32]
  - case_id: bell
    plan_id: null
    route_ids: [quimb, cotengra]
