schema_version: tn_benchmark_v2
experiment_id: one-dpu-reset-qualification
defaults:
  timeout_s: 120.0
collection:
  base_seed: 20260825
  warmup_blocks: 1
  measurement_blocks: 5
  session_policy: fresh_session_per_attempt_v1
  cooldown_s: 0.0
  machine_policy:
    machine_exclusivity: observed_v1
    cpu_governor: observed_v1
    affinity: observed_v1
    numa_policy: observed_v1
    background_load: observed_v1
cases:
  bell_2q:
    circuit:
      kind: builtin
      name: bell_2q
      path: null
      parameters: {}
  complex_2q:
    circuit:
      kind: builtin
      name: quantization_stress
      path: null
      parameters:
        n_qubits: 2
        repeat_layers: 2
plans:
  greedy:
    planner:
      engine: opt_einsum
      mode: greedy
      max_repeats: 1
      seed: 0
    slicing: null
routes:
  upmem_float32_1dpu:
    executor: upmem_physical
    numeric_policy: split_complex_float32_v1
    options:
      dpu_count: 1
      rank_count: 1
      tasklets_per_dpu: 1
      session_root: ../runs/upmem_sessions/physical_float32
      host_binary: ../native/upmem/runtime/bin/host_upmem_execution_plan_v4_t1
      dpu_binary: ../native/upmem/runtime/bin/dpu_gemm_tile_v4_t1
      initialization_binary: ../native/upmem/runtime/bin/dpu_simplepim_management_init_t1
      rank_paths: [/dev/dpu_rank0]
  upmem_int8_1dpu:
    executor: upmem_physical
    numeric_policy: split_complex_int8_shared_scale_v1
    options:
      dpu_count: 1
      rank_count: 1
      tasklets_per_dpu: 1
      session_root: ../runs/upmem_sessions/physical_int8
      host_binary: ../native/upmem/runtime/bin/host_upmem_execution_plan_v4_t1
      dpu_binary: ../native/upmem/runtime/bin/dpu_gemm_tile_v4_t1
      initialization_binary: ../native/upmem/runtime/bin/dpu_simplepim_management_init_t1
      rank_paths: [/dev/dpu_rank0]
matrix:
  - case_id: bell_2q
    plan_id: greedy
    route_ids: [upmem_float32_1dpu, upmem_int8_1dpu]
  - case_id: complex_2q
    plan_id: greedy
    route_ids: [upmem_float32_1dpu, upmem_int8_1dpu]
