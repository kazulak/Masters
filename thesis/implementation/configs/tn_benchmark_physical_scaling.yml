schema_version: tn_benchmark_v3
experiment_id: m7c-scaling-performance-stress18
defaults:
  timeout_s: 120.0
collection:
  claim_policy: physical_performance_v1
  base_seed: 20260826
  warmup_blocks: 2
  measurement_blocks: 30
  session_policy: fresh_session_per_attempt_v1
  block_cooldown_s: 0.0
  machine_policy:
    machine_exclusivity:
      mode: operator_attested_v1
    cpu_governor:
      mode: performance_required_v1
    affinity:
      mode: exact_required_v1
      expected_cpus: [0]
    numa_policy:
      mode: operator_attested_v1
    background_load:
      mode: observed_v1
      max_load1_per_online_cpu: 0.25
cases:
  scaling_primary:
    circuit:
      kind: builtin
      name: quantization_stress
      path: null
      parameters:
        n_qubits: 18
        repeat_layers: 2
plans:
  greedy:
    planner:
      engine: opt_einsum
      mode: greedy
      max_repeats: 1
      seed: 0
    slicing: null
routes:
  numpy_same_dag:
    executor: numpy_dag
    numeric_policy: split_complex_float32_v1
    options: {}
  upmem_float32_1dpu_t1:
    executor: upmem_physical
    numeric_policy: split_complex_float32_v1
    options:
      dpu_count: 1
      rank_count: 1
      tasklets_per_dpu: 1
      session_root: ../runs/upmem_sessions/scaling_performance_t1
      host_binary: ../native/upmem/runtime/bin/host_upmem_execution_plan_v4_t1
      dpu_binary: ../native/upmem/runtime/bin/dpu_gemm_tile_v4_t1
      initialization_binary: ../native/upmem/runtime/bin/dpu_simplepim_management_init_t1
      rank_paths: [/dev/dpu_rank0]
  upmem_float32_1dpu_t8:
    executor: upmem_physical
    numeric_policy: split_complex_float32_v1
    options:
      dpu_count: 1
      rank_count: 1
      tasklets_per_dpu: 8
      session_root: ../runs/upmem_sessions/scaling_performance_t8_1dpu
      host_binary: ../native/upmem/runtime/bin/host_upmem_execution_plan_v4_t8
      dpu_binary: ../native/upmem/runtime/bin/dpu_gemm_tile_v4_t8
      initialization_binary: ../native/upmem/runtime/bin/dpu_simplepim_management_init_t8
      rank_paths: [/dev/dpu_rank0]
  upmem_float32_2dpu_t8:
    executor: upmem_physical
    numeric_policy: split_complex_float32_v1
    options:
      dpu_count: 2
      rank_count: 1
      tasklets_per_dpu: 8
      session_root: ../runs/upmem_sessions/scaling_performance_t8_2dpu
      host_binary: ../native/upmem/runtime/bin/host_upmem_execution_plan_v4_t8
      dpu_binary: ../native/upmem/runtime/bin/dpu_gemm_tile_v4_t8
      initialization_binary: ../native/upmem/runtime/bin/dpu_simplepim_management_init_t8
      rank_paths: [/dev/dpu_rank0]
  upmem_float32_4dpu_t8:
    executor: upmem_physical
    numeric_policy: split_complex_float32_v1
    options:
      dpu_count: 4
      rank_count: 1
      tasklets_per_dpu: 8
      session_root: ../runs/upmem_sessions/scaling_performance_t8_4dpu
      host_binary: ../native/upmem/runtime/bin/host_upmem_execution_plan_v4_t8
      dpu_binary: ../native/upmem/runtime/bin/dpu_gemm_tile_v4_t8
      initialization_binary: ../native/upmem/runtime/bin/dpu_simplepim_management_init_t8
      rank_paths: [/dev/dpu_rank0]
matrix:
  - case_id: scaling_primary
    plan_id: greedy
    route_ids:
      - numpy_same_dag
      - upmem_float32_1dpu_t1
      - upmem_float32_1dpu_t8
      - upmem_float32_2dpu_t8
      - upmem_float32_4dpu_t8
