metadata:
  execution_tier: modeled_planning_only
  hardware_performance_claim: forbidden
  intended_use: thesis_evidence_planner_semantic_v2
  manual_invocation_required: true
  notes: 'Small quantum tensor networks exercise the v2 semantic contract alongside
    standard opt_einsum/cotengra planning baselines. Controlled synthetic motifs exercise
    the same modeled objective but are not real quantum circuits. Zero-imaginary complex
    inputs are accepted as real-valued work; nonzero complex inputs are modeled as
    split real/imaginary components where the bounded policy supports them. No contraction
    runtime or hardware performance claim is produced by this suite.

    '
  numeric_contract: real_float32_or_split_real_imag_v2
  planner_evidence_version: v2
  planner_selection_scope: projected_prefix
  purpose: thesis_modeled_upmem_planner_v2_semantic_evidence
planner:
  engine: opt_einsum
  optimize: greedy
planner_comparison:
  pim_objective:
    execution_policy: generic_single_dpu_split_complex_v2
    normalization: fixed_log1p_generic_budgets_v2
    objective_version: upmem_path_cost_v2
    weight_profile: balanced_literature_informed
  planners:
  - engine: opt_einsum
    optimize: greedy
  - engine: opt_einsum
    optimize: auto
  - engine: cotengra
    max_repeats: 1
    methods: greedy
    objective: flops
  - engine: cotengra
    max_repeats: 1
    methods: greedy
    objective: size
  - algorithm: greedy
    engine: custom_upmem
    execution_policy: generic_single_dpu_split_complex_v2
    normalization: fixed_log1p_generic_budgets_v2
    objective_version: upmem_path_cost_v2
    selection_scope: projected_prefix
    weight_profile: balanced_literature_informed
repeats: 1
