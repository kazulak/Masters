schema_version: benchmark_config-0.1

experiment:
  id: ghz_4q_tn_cpu
  description: Tensor-network CPU route for GHZ 4q.
  seed: 0
  tags: [tn, cpu, sanity]
  output_dir: runs/ghz_4q_tn_cpu

workload:
  kind: builtin_circuit
  name: ghz_4q

planner:
  engine: opt_einsum
  optimize: optimal

execution:
  warmups: 1
  repeats: 5
  routes:
    enabled: [cpu_reference]
    forced: cpu_reference
    disabled: [quest_exact_statevector, raw_upmem_dense, gpu_cupy, simplepim_default, custom_dense, sparsep, pidcomm_collective]
  data_format:
    name: complex_f64_host
    logical_dtype: complex_f64
    accumulator: complex_f64
    scale_scope: none

measurement:
  energy:
    mode: estimated_static_power
    cpu_watts: 65.0

validation:
  reference: numpy_full_einsum
  tolerances:
    max_abs_error: 1.0e-12
    max_rel_error: 1.0e-12
    norm_drift: 1.0e-12
    min_fidelity: 0.999999999999

