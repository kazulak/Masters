schema_version: benchmark_config-0.1

experiment:
  id: bell_2q_quest_exact
  description: Exact QuEST full-state CPU route for Bell state.
  seed: 0
  tags: [quest, full_state, cpu, sanity]
  output_dir: runs/bell_2q_quest_exact

workload:
  kind: builtin_circuit
  name: bell_2q

planner:
  engine: opt_einsum
  optimize: optimal

execution:
  warmups: 1
  repeats: 5
  routes:
    enabled: [quest_exact_statevector]
    forced: quest_exact_statevector
    disabled: [cpu_reference, raw_upmem_dense, gpu_cupy, simplepim_default, custom_dense, sparsep, pidcomm_collective]
  data_format:
    name: complex_f64_host
    logical_dtype: complex_f64
    accumulator: complex_f64
    scale_scope: none

measurement:
  energy:
    mode: rapl_or_estimated_static_power
    cpu_watts: 65.0

validation:
  reference: numpy_full_einsum
  tolerances:
    max_abs_error: 1.0e-12
    max_rel_error: 1.0e-12
    norm_drift: 1.0e-12
    min_fidelity: 0.999999999999

