suite_id: local_energy
description: Local RAPL-oriented sweep using larger state vectors to avoid zero-energy medians.
algorithms: [BB84, BV, EDC, HS, QRNG, XOR]
qubits:
  default:
    start: 18
    stop: 24
    step: 2
  HS:
    start: 9
    stop: 12
    step: 1
repeats: 5
warmups: 1
timeout_s: 180
memory_guard:
  max_allocated_qubits: 24
thread_counts: [1]
plot: true
largest_fair_bb84:
  enabled: false
