name: thesis-implementation-ci

on:
  push:
    paths:
      - "thesis/implementation/**"
      - ".github/workflows/thesis-implementation-ci.yml"
  pull_request:
    paths:
      - "thesis/implementation/**"
      - ".github/workflows/thesis-implementation-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install package
        run: |
          cd thesis/implementation
          python -m pip install --upgrade pip
          python -m pip install -c ci/constraints.txt -e ".[dev]"
      - name: Build QuEST CPU runner
        run: make -C thesis/implementation/native/quest_cpu
      - name: Build Python wheel
        run: |
          cd thesis/implementation
          python -m pip wheel --no-build-isolation --no-deps --wheel-dir /tmp/quantum-bench-wheel .
      - name: Run tests
        run: |
          make -C thesis/implementation PYTHON=python test
      - name: Run Ruff correctness checks
        run: |
          cd thesis/implementation
          python -m ruff check src tests scripts
      - name: Check active Makefile commands
        run: |
          cd thesis/implementation
          make PYTHON=python -n plan CONFIG=configs/tn_benchmark_reset.yml OUTPUT="$RUNNER_TEMP/qbench-plan"
          make PYTHON=python -n run CONFIG=configs/tn_benchmark_reset.yml OUTPUT="$RUNNER_TEMP/qbench-run"
          make PYTHON=python -n report INPUT="$RUNNER_TEMP/qbench-run" REPORT_OUTPUT="$RUNNER_TEMP/qbench-report"
          make PYTHON=python -n verify INPUT="$RUNNER_TEMP/qbench-run"
          make PYTHON=python -n qualify PHYSICAL_CONFIG=configs/tn_benchmark_physical.yml OUTPUT="$RUNNER_TEMP/qbench-qualify" UPMEM_ALLOW_PHYSICAL_HARDWARE=1
          make PYTHON=python -n build-upmem-runtime UPMEM_TASKLETS=1
      - name: Run active plan, benchmark, verification, and report smoke
        run: |
          cd thesis/implementation
          RUN_ROOT="$RUNNER_TEMP/qbench-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          PLAN_DIR="$RUN_ROOT/plan"
          RUN_DIR="$RUN_ROOT/run"
          REPORT_DIR="$RUN_ROOT/report"
          mkdir -p "$RUN_ROOT"
          make PYTHON=python plan \
            CONFIG=configs/tn_benchmark_reset.yml \
            OUTPUT="$PLAN_DIR"
          make PYTHON=python run \
            CONFIG=configs/tn_benchmark_reset.yml \
            OUTPUT="$RUN_DIR"
          make PYTHON=python verify INPUT="$RUN_DIR"
          make PYTHON=python report \
            INPUT="$RUN_DIR" \
            REPORT_OUTPUT="$REPORT_DIR"
