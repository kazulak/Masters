name: thesis-implementation-ci

on:
  push:
    paths:
      - "thesis/implementation/**"
      - ".github/workflows/thesis-implementation-ci.yml"
  pull_request:
    paths:
      - "thesis/implementation/**"
      - ".github/workflows/thesis-implementation-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install package
        run: |
          cd thesis/implementation
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Build QuEST CPU runner
        run: make -C thesis/implementation/native/quest_cpu
      - name: Run tests
        run: |
          cd thesis/implementation
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src python -m pytest -q
      - name: Run smoke
        run: |
          cd thesis/implementation
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src python -m quantum_bench.bench run --suite configs/suites/smoke.yml
